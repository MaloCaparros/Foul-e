# Application + PostgreSQL. Lancer avec : docker compose up -d --build
# Définir POSTGRES_PASSWORD (et éventuellement ANTHROPIC_API_KEY) dans un fichier .env à côté de ce fichier.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foulee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: foulee
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foulee"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://foulee:${POSTGRES_PASSWORD}@db:5432/foulee
      # Derrière un proxy HTTPS (Caddy, Traefik, nginx) : laisser "production".
      # Pour un essai en HTTP simple sur localhost, mettre NODE_ENV=development.
      NODE_ENV: ${NODE_ENV:-production}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
    ports:
      - "3000:3000"

volumes:
  pgdata:
